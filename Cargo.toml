[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/z3nghoul/repo-sniff"

[workspace.dependencies]
repo-sniff-core = { path = "crates/repo-sniff-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"

# The bidi rule lays out lines of up to 64 KiB; unoptimized, its tests take seconds.
[profile.dev.package.unicode-bidi]
opt-level = 3
[profile.dev.package.repo-sniff-core]
opt-level = 1
