version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date; Dependabot
  # rewrites both the SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Covers the whole cargo workspace through the root Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      # One pull request for routine bumps instead of one per crate.
      cargo-minor-and-patch:
        update-types: [minor, patch]
