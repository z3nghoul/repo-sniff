[package]
name = "repo-sniff-core"
description = "Scanning engine of repo-sniff: rules, file walking and findings, with no UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
globset = "0.4.21"
ignore = "0.4.34"
aho-corasick = "1.1.5"
regex = "1.13.1"
serde.workspace = true
thiserror = "2.0.21"
toml = "1.1.8"
# Exact: the Unicode tables it carries decide what the bidi rule calls unchanged.
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["std", "hardcoded-data"] }

[dev-dependencies]
tempfile.workspace = true
