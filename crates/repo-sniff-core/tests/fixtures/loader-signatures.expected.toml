# What the built-in rules report when loader-signatures/ is scanned as one
# repository. Read by tests/fixture_expectations.rs; a finding not listed here
# fails the test, so every file under negative/ must stay unreported.
# The marker is line 1 of a script or the `//` key of a package.json (line 2).
#
# Levels that need a reason, in the order of the fixtures:
# - fetch-eval and function-require are CRITICAL; a call the check cannot follow
#   (a computed name on the global object) and a file it cannot read to the end
#   (an unterminated template) are MEDIUM and say "review it by hand".
# - obfuscator.io output is CRITICAL when a tool runs the file (a configuration
#   file such as next.config.js or .eslintrc.js, or a file an npm script starts),
#   HIGH in other source and MEDIUM under dist/, build/ or public/.
# - a minified line in source is MEDIUM; under dist/ it is INFO, not silence.
# - the Windows lines are judged by the rules in the issue; the .bat, .cmd, .ps1,
#   .vbs, .wsf and .hta findings of repo.windows-script and repo.windows-dropper
#   are the ones that already existed.

