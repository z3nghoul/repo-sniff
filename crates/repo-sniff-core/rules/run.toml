# Stage: run. Code that runs when a developer starts, builds or tests the project.

[[rule]]
id          = "run.npm-script-local-server"
engine      = "file"
family      = "npm-scripts"
stage       = "run"
# Full-stack repositories do this honestly, so the level is low; the file it
# names is the thing to read, and milestone 3 raises it when the file itself
# has a loader finding. A script the check could not read completely is
# reported too, at medium (see deps.npm-lifecycle-hook).
severity    = "low"
attack      = ["T1059.007"]
description = "An npm start, dev, build or test script runs a local JavaScript file (node <path>, nodemon <path>) next to a front-end tool such as react-scripts, vite, next or webpack. A build or test script that starts a server is unusual"
example     = 'package.json:6 sets "test" to "node server/server.js | react-scripts test"'
files       = ["**/package.json"]
