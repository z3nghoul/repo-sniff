# Stage: run. Code that runs when a developer starts, builds or tests the project.

[[rule]]
id          = "run.npm-script-local-server"
engine      = "file"
family      = "npm-scripts"
stage       = "run"
# Full-stack repositories do this honestly, so the level is low; the file it
# names is the thing to read, and milestone 3 raises it when the file itself
# has a loader finding. A script the check could not read completely is
# reported too, at medium (see deps.npm-lifecycle-hook).
severity    = "low"
attack      = ["T1059.007"]
description = "An npm start, dev, build or test script runs a local JavaScript file (node <path>, nodemon <path>) next to a front-end tool such as react-scripts, vite, next or webpack. A build or test script that starts a server is unusual"
example     = 'package.json:6 sets "test" to "node server/server.js | react-scripts test"'
files       = ["**/package.json"]

[[rule]]
id          = "run.js-fetch-eval"
engine      = "file"
family      = "loader-signatures"
stage       = "run"
# Code that is downloaded and run is a loader whatever the file is called. A call
# the check could not follow, or a file it could not read to the end, while the
# file makes network calls, is reported at medium and says to review it by hand.
severity    = "critical"
attack      = ["T1105", "T1059.007"]
description = "A JavaScript file passes data from a network call (axios, fetch, http.get, got) to eval, new Function, Function() or vm.runIn*, in the same file. The code that runs is downloaded when the program runs, so what the repository shows is not what executes"
example     = 'server/controllers/userController.js:7 calls eval on the result of axios.get'
files       = ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.jsx", "**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts"]
# A padded file past 5 MiB must not hide a loader, so a large file is read whole.
reads_large_files = true

[[rule]]
id          = "run.js-function-require"
engine      = "file"
family      = "loader-signatures"
stage       = "run"
severity    = "critical"
attack      = ["T1059.007", "T1620"]
description = "A JavaScript file builds a function with new Function(\"require\", ...) and calls it with require. Code assembled at run time gets the module loader, so it can read files, start programs and open connections: the usual shape of a loader"
example     = 'lib/loader.js:3 calls new Function("require", body)(require)'
files       = ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.jsx", "**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts"]
# A padded file past 5 MiB must not hide a loader, so a large file is read whole.
reads_large_files = true
