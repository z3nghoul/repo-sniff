# Stage: deception. Tricks aimed at the human reading the code.

[[rule]]
id          = "deception.bidi-control"
engine      = "bidi-display"
family      = "trojan-source"
stage       = "deception"
severity    = "critical"
attack      = []
description = "Unicode bidirectional control characters change how code is displayed without changing how it is compiled or run, so what a reviewer reads can differ from what executes (Trojan Source, CVE-2021-42574)"
example     = "src/auth.rs:12 contains U+202E (RIGHT-TO-LEFT OVERRIDE)"
# Looks at U+202A..U+202E (LRE, RLE, PDF, LRO, RLO) and U+2066..U+2069 (LRI,
# RLI, FSI, PDI). The level is the rule's own when the line is displayed
# differently with them, LOW when it is not (bidi.rs).

[[rule]]
id          = "deception.nul-byte-in-script"
engine      = "nul-byte"
family      = "concealment"
stage       = "deception"
severity    = "high"
attack      = ["T1027"]
description = "A script (by extension or shebang) contains a NUL byte. Shells and interpreters read the file anyway, but editors, diffs and scanners that treat NUL as the mark of a binary file stop at it, so whatever follows is easy to miss"
example     = 'install.sh:3 has a NUL byte inside a comment'
